type: object
x-class-extra-annotation: "@lombok.AllArgsConstructor"
properties:
  prosecutionCases:
    type: array
    minItems: 1
    items:
      $ref: ./CaseDetails.yaml
  prosecutingAuthority:
    type: string
    description: Identifies the Prosecuting Organisation responsible for initiating
      the case
    pattern: ^[a-zA-Z0-9-]*$
    minLength: 7
    maxLength: 7
  hearingDetails:
    $ref: ./HearingDetails.yaml
  hearingDateRangeDetails:
    allOf:
    - $ref: ./HearingDateRangeDetails.yaml
    description: Court Hearing date range details for enforcement cases
  relatedReferenceNumber:
    type: string
    description: GoB account number (Libra account reference) tied to the defendant. Required for enforcement cases.
    maxLength: 13
required:
- prosecutionCases
- prosecutingAuthority
oneOf:
- required:
  - hearingDetails
- required:
  - hearingDateRangeDetails
additionalProperties: false
