type: object
properties:
  prosecutionCases:
    type: array
    minItems: 1
    items:
      allOf:
        - $ref: ./CaseDetails.yaml
        - required:
            - summonsCode
          properties:
            summonsCode:
              enum:
                - A
  prosecutingAuthority:
    type: string
    description: Identifies the Prosecuting Organisation responsible for initiating the case
    pattern: "^[a-zA-Z0-9-]*$"
    minLength: 7
    maxLength: 7
  hearingDetails:
    $ref: ./HearingDetails.yaml
required:
  - prosecutionCases
  - prosecutingAuthority
  - hearingDetails
additionalProperties: false
