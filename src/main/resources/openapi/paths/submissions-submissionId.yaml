get:
  summary: Get Submission Operation
  description: >-
    Retrieve the processing status, and any errors or warnings, of a civil
    prosecution submission (stagingcivil.submission-details).
  tags:
    - Retrieve Submitted Info
  parameters:
    - in: path
      name: submissionId
      description: Obtained via the case submission operation response
      schema:
        type: string
        format: uuid
      required: true
    - in: query
      name: additionalInfo
      required: false
      description: >-
        When true, also returns fileName, username and prosecutingAuthority when
        they were captured on the submission
      schema:
        type: boolean
        default: false
  responses:
    '200':
      description: OK. Response contains the current status of the submission
      content:
        application/vnd.stagingcivil.submission-details+json:
          schema:
            $ref: '../schemas/SubmissionDetails.yaml'
          example:
            id: cedb215e-9297-4799-9a4d-5c608eaa4131
            status: SUCCESS_WITH_WARNINGS
            type: PROSECUTION
            receivedAt: '2026-08-14T10:15:30.000Z'
            completedAt: '2026-08-14T10:16:45.000Z'
            materialWarnings: []
            materialErrors: []
            caseErrors: []
            caseWarnings: []
            defendantErrors: []
            defendantWarnings:
              - prosecutorDefendantReference: DEFENDANTID1
                problems:
                  - code: OFFENCE_OUT_OF_TIME
                    values:
                      - key: daysOverdue
                        value: '1'
    '400':
      description: Bad Request
    '404':
      description: Submission not found
    '500':
      description: Internal Server Error
